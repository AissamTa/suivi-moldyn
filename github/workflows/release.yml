name: Compiler l'APK et publier la release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Vérifier que le tag correspond à config.js
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CFG=$(grep -oP "VERSION:\s*'\K[^']+" www/js/config.js)
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG · config.js=$CFG · package.json=$PKG"
          if [ "$TAG" != "$CFG" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Le tag ($TAG), config.js ($CFG) et package.json ($PKG) doivent être identiques."
            echo "::error::Sinon le bandeau de mise à jour s'afficherait chez tout le monde sans qu'une nouvelle version existe."
            exit 1
          fi
          IFS='.' read -r MA MI PA <<< "$TAG"
          echo "name=$TAG"                                   >> $GITHUB_OUTPUT
          echo "code=$((MA * 10000 + MI * 100 + PA))"        >> $GITHUB_OUTPUT

      - name: Vérifier la présence de la clé de signature
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent. Voir docs/GITHUB.md, section « Clé de signature »."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Poser versionCode / versionName
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.code }}/"      android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.name }}\"/"  android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Restaurer la clé de signature
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/moldyn.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('moldyn.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Compiler
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
             "dist/SuiviMOLDYN-${{ steps.version.outputs.name }}.apk"
          ls -lh dist/

      - name: Effacer la clé du runner
        if: always()
        run: rm -f android/app/moldyn.keystore

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
