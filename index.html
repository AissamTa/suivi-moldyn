<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161d24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Suivi de Production — MOLDYN</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#161d24; --steel:#2c3944; --steel-light:#465563;
    --paper:#e9edf0; --panel:#ffffff; --line:#c9d2d8;
    --amber:#f2a20c; --amber-dark:#c97f05; --green:#2f9e6b; --red:#d64550;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif; --disp:'Barlow Condensed',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--amber);color:var(--ink);}

  .topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--amber);}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:0.5px;color:var(--amber);}
  .brand .sub{font-family:var(--mono);font-size:11px;color:#9fb0bd;letter-spacing:1px;text-transform:uppercase;}
  .clockbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;}
  .clockbox .clock-time{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--amber);letter-spacing:1px;}
  .clockbox .clock-date{font-family:var(--mono);font-size:10px;color:#9fb0bd;letter-spacing:1px;text-transform:uppercase;}
  @media(max-width:520px){.clockbox .clock-time{font-size:15px;}.clockbox .clock-date{font-size:9px;}}

  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
  h2.section-title{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:0.3px;margin:28px 0 12px;padding-left:12px;border-left:5px solid var(--amber);color:var(--ink);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;}
  .setup-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  @media(max-width:800px){.setup-grid{grid-template-columns:repeat(2,1fr);}}
  .field{background:var(--panel);padding:10px 14px;}
  .field label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--steel-light);margin-bottom:5px;}
  .field input, .field select{width:100%;border:none;background:transparent;font-family:var(--sans);font-weight:600;font-size:15px;color:var(--ink);padding:2px 0;}
  .field input:focus, .field select:focus{outline:none;border-bottom:2px solid var(--amber);}

  .ref-row{background:var(--panel);border:1px solid var(--line);border-top:none;padding:12px 14px;}
  .ref-row:first-of-type{border-top:1px solid var(--line);}
  .ref-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .ref-head input{font-family:var(--mono);font-weight:600;font-size:16px;border:none;border-bottom:2px solid var(--steel-light);background:transparent;padding:4px 2px;width:160px;color:var(--ink);}
  .ref-head input:focus{outline:none;border-color:var(--amber);}
  .ref-head .ref-label{font-family:var(--mono);font-size:11px;color:var(--steel-light);text-transform:uppercase;letter-spacing:1px;}
  .del-ref{margin-left:auto;border:1px solid var(--line);background:none;color:var(--red);font-size:11px;font-family:var(--mono);padding:4px 8px;cursor:pointer;border-radius:2px;}
  .del-ref:hover{background:var(--red);color:#fff;border-color:var(--red);}

  .strip{display:grid;grid-template-columns:repeat(8,1fr) 90px;gap:6px;}
  @media(max-width:700px){.strip{grid-template-columns:repeat(4,1fr);}}
  .hcell{text-align:center;}
  .hcell .hlabel{font-family:var(--mono);font-size:10px;color:var(--steel-light);margin-bottom:3px;}
  .hcell input{width:100%;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px;padding:8px 2px;border:1px solid var(--line);border-radius:2px;color:var(--ink);background:#fafbfc;}
  .hcell input:focus{outline:none;border-color:var(--amber);background:#fff;}
  .total-box{background:var(--ink);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;}
  .total-box .tlabel{font-family:var(--mono);font-size:9px;color:#9fb0bd;letter-spacing:1px;}
  .total-box .tval{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--amber);}

  .add-ref{display:block;width:100%;padding:12px;background:var(--panel);border:1px dashed var(--line);border-top:none;color:var(--steel-light);font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  .add-ref:hover{background:#f2f4f5;color:var(--ink);}

  .comment-grid{background:var(--panel);border:1px solid var(--line);}
  .comment-line{display:grid;grid-template-columns:60px 1fr;border-top:1px solid var(--line);}
  .comment-line:first-child{border-top:none;}
  .comment-line .hh{font-family:var(--disp);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;background:#f2f4f5;color:var(--steel);border-right:1px solid var(--line);}
  .comment-line .cbody{display:grid;grid-template-columns:1fr 80px;}
  .comment-line select, .comment-line input{border:none;padding:10px 12px;font-family:var(--sans);font-size:13px;color:var(--ink);background:transparent;}
  .comment-line select{border-right:1px solid var(--line);font-weight:500;}
  .comment-line input{text-align:center;font-family:var(--mono);}
  .comment-line select:focus, .comment-line input:focus{outline:none;background:#fffbf0;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button.primary{background:var(--amber);border:none;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:0.4px;padding:12px 22px;border-radius:2px;cursor:pointer;}
  button.primary:hover{background:var(--amber-dark);}
  button.ghost{background:none;border:1px solid var(--steel-light);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:15px;padding:12px 22px;border-radius:2px;cursor:pointer;}
  button.ghost:hover{border-color:var(--ink);}
  .status-msg{font-family:var(--mono);font-size:12px;color:var(--green);display:flex;align-items:center;}

  .log-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);}
  .log-table th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--steel-light);text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);}
  .log-table td{padding:10px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top;}
  .log-table tr:hover td{background:#fafbfc;}
  .pill{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:2px 9px;display:inline-block;margin:1px 3px 1px 0;}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:#fff;padding:5px 9px;border-radius:2px;cursor:pointer;}
  .row-actions button.xls{color:var(--green);}
  .row-actions button.del{color:var(--red);}
  .row-actions button:hover{border-color:currentColor;}
  .empty{text-align:center;padding:40px 20px;color:var(--steel-light);font-family:var(--mono);font-size:12px;}

  .dl-banner{position:sticky;top:0;z-index:50;background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--sans);font-size:13px;}
  .dl-banner #dl-text{font-weight:600;}
  .dl-banner a{background:#fff;color:var(--green);font-family:var(--disp);font-weight:700;font-size:15px;padding:8px 16px;border-radius:2px;text-decoration:none;}
  .dl-banner button{margin-left:auto;background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}

  .dev-footer{text-align:center;padding:14px 10px 18px;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;color:#8b98a3;letter-spacing:0.2px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
  .dev-footer svg{width:13px;height:13px;flex-shrink:0;opacity:0.75;}
  @media(max-width:480px){.dev-footer{font-size:11px;padding:12px 8px 16px;}}
</style>
</head>
<body>

<div class="dl-banner" id="dl-banner" style="display:none;">
  <span id="dl-text">Fichier prêt</span>
  <a id="dl-link" href="#" download>⬇ Appuie ici pour télécharger</a>
  <button id="dl-close" type="button">✕</button>
</div>

<div class="topbar">
  <div class="brand">
    <span class="mark">MOLDYN</span>
    <span class="sub">Suivi de Production &middot; Équipe partagée</span>
  </div>
  <div class="clockbox">
    <span class="clock-time" id="clock-time">--:--:--</span>
    <span class="clock-date" id="clock-date">—</span>
  </div>
</div>

<div class="wrap">

  <h2 class="section-title">Fiche du jour</h2>
  <div class="setup-grid">
    <div class="field"><label>Date</label><input type="date" id="f-date"></div>
    <div class="field"><label>Mat</label><input type="text" id="f-mat" placeholder="202"></div>
    <div class="field"><label>Shift</label>
      <select id="f-shift">
        <option value="Matin">Matin</option>
        <option value="Soir">Soir</option>
        <option value="Nuit">Nuit</option>
      </select>
    </div>
    <div class="field"><label>Process</label>
      <select id="f-process">
        <option value="ML05 - Laser">ML05 - Laser</option>
        <option value="ML04 - Laser">ML04 - Laser</option>
        <option value="ML02 - Laser">ML02 - Laser</option>
      </select>
    </div>
  </div>

  <h2 class="section-title">Références &amp; production horaire</h2>
  <div id="ref-list"></div>
  <button class="add-ref" id="add-ref">+ Ajouter une référence</button>

  <h2 class="section-title">Commentaires</h2>
  <div class="comment-grid" id="comment-grid"></div>

  <div class="actions">
    <button class="primary" id="save-entry">Enregistrer la fiche</button>
    <button class="ghost" id="reset-form">Nouvelle fiche vierge</button>
    <span class="status-msg" id="status-msg"></span>
  </div>

  <h2 class="section-title">Journal de l'équipe</h2>
  <table class="log-table" id="log-table">
    <thead>
      <tr><th>Date</th><th>Shift</th><th>Mat</th><th>Process</th><th>Références</th><th>Total</th><th></th></tr>
    </thead>
    <tbody id="log-body"></tbody>
  </table>
  <div class="empty" id="log-empty" style="display:none;">Aucune fiche enregistrée pour l'instant.</div>

</div>

<footer class="dev-footer">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v10H4z"/><path d="M2 18h20l-1.5 2h-17z"/></svg>
  <span>Developed by Khalid El Arabi &copy; <span id="dev-year"></span></span>
</footer>

<script>
// ─── Adapter de stockage ───────────────────────────────────────
// Dans Claude : window.storage (partage équipe).
// En APK / navigateur autonome : localStorage du téléphone (données locales persistantes).
window.__localOnly = false;
if(typeof window.storage === 'undefined' || !window.storage){
  window.__localOnly = true;
  window.storage = {
    async get(key){ const v = localStorage.getItem('sp_'+key); return v===null ? null : {key, value:v}; },
    async set(key, value){ localStorage.setItem('sp_'+key, value); return {key, value}; },
    async delete(key){ localStorage.removeItem('sp_'+key); return {key, deleted:true}; },
    async list(prefix){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf('sp_'+(prefix||''))===0) keys.push(k.slice(3)); } return {keys, prefix}; }
  };
}

const CODES = ["PAUSE","ATT VALIDATION","ARRET MAINTENANCE","ARRET QUALITE","ATT PIECES","FORMATION / REUNION"];
let refs = [];
let comments = {};
let editingId = null;
let localEntries = [];

function uid(){ return 'e' + Date.now() + Math.random().toString(36).slice(2,7); }
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function newRef(){ return { ref:'', hours:['','','','','','','',''] }; }
function defaultComments(){
  return {1:{code:'',mins:''},2:{code:'',mins:''},3:{code:'',mins:''},4:{code:'',mins:''},5:{code:'',mins:''},6:{code:'',mins:''},7:{code:'',mins:''},8:{code:'',mins:''}};
}

function addRef(){ refs.push(newRef()); renderRefs(); }
function removeRef(idx){ refs.splice(idx,1); renderRefs(); }

function renderRefs(){
  const list = document.getElementById('ref-list');
  list.innerHTML = '';
  refs.forEach((r, idx) => {
    const total = r.hours.reduce((s,v)=> s + (parseFloat(v)||0), 0);
    const div = document.createElement('div');
    div.className = 'ref-row';
    div.innerHTML = `
      <div class="ref-head">
        <span class="ref-label">Réf</span>
        <input type="text" value="${r.ref}" data-idx="${idx}" class="ref-num" placeholder="ex: 497">
        <button class="del-ref" data-idx="${idx}">Retirer</button>
      </div>
      <div class="strip">
        ${r.hours.map((v,h)=>`
          <div class="hcell">
            <div class="hlabel">${h+1}H</div>
            <input type="number" inputmode="numeric" value="${v}" data-ridx="${idx}" data-hidx="${h}" class="hour-input">
          </div>`).join('')}
        <div class="total-box">
          <div class="tlabel">TOTAL</div>
          <div class="tval" data-total="${idx}">${total}</div>
        </div>
      </div>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll('.ref-num').forEach(inp=>{
    inp.addEventListener('focus', e=> e.target.select());
    inp.addEventListener('input', e=>{ refs[+e.target.dataset.idx].ref = e.target.value; });
  });
  list.querySelectorAll('.hour-input').forEach(inp=>{
    inp.addEventListener('focus', e=> e.target.select());
    inp.addEventListener('input', e=>{
      const ridx = +e.target.dataset.ridx, hidx = +e.target.dataset.hidx;
      refs[ridx].hours[hidx] = e.target.value;
      const total = refs[ridx].hours.reduce((s,v)=> s + (parseFloat(v)||0), 0);
      const totalEl = document.querySelector(`[data-total="${ridx}"]`);
      if(totalEl) totalEl.textContent = total;
    });
  });
  list.querySelectorAll('.del-ref').forEach(btn=>{
    btn.addEventListener('click', e=> removeRef(+e.target.dataset.idx));
  });
}

function renderComments(){
  const grid = document.getElementById('comment-grid');
  grid.innerHTML = '';
  for(let h=1; h<=8; h++){
    const c = comments[h] || {code:'', mins:''};
    const line = document.createElement('div');
    line.className = 'comment-line';
    line.innerHTML = `
      <div class="hh">${h}H</div>
      <div class="cbody">
        <select data-h="${h}" class="code-select">
          <option value="">— Aucun arrêt —</option>
          ${CODES.map(code=>`<option value="${code}" ${c.code===code?'selected':''}>${code}</option>`).join('')}
        </select>
        <input type="number" inputmode="numeric" data-h="${h}" class="mins-input" placeholder="min" value="${c.mins||''}">
      </div>
    `;
    grid.appendChild(line);
  }
  grid.querySelectorAll('.code-select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const h = e.target.dataset.h;
      if(!comments[h]) comments[h] = {code:'', mins:''};
      comments[h].code = e.target.value;
    });
  });
  grid.querySelectorAll('.mins-input').forEach(inp=>{
    inp.addEventListener('focus', e=> e.target.select());
    inp.addEventListener('input', e=>{
      const h = e.target.dataset.h;
      if(!comments[h]) comments[h] = {code:'', mins:''};
      comments[h].mins = e.target.value;
    });
  });
}

function resetForm(){
  document.getElementById('f-date').value = todayISO();
  document.getElementById('f-mat').value = '';
  document.getElementById('f-shift').value = 'Matin';
  document.getElementById('f-process').value = 'ML05 - Laser';
  refs = [newRef()];
  comments = defaultComments();
  editingId = null;
  renderRefs();
  renderComments();
  document.getElementById('status-msg').textContent = '';
}

function showStatus(msg){
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 3000);
}

async function getIndex(){
  try{
    const r = await window.storage.get('index', true);
    if(r && r.value){ const arr = JSON.parse(r.value); if(Array.isArray(arr)) return arr; }
  }catch(err){}
  return [];
}
async function setIndex(arr){
  try{ await window.storage.set('index', JSON.stringify(arr), true); }catch(err){}
}

async function saveEntry(){
  const date = document.getElementById('f-date').value;
  if(!date){ showStatus('⚠ Ajoute une date'); return; }
  const cleanRefs = refs.filter(r=> r.ref.trim() !== '');
  if(cleanRefs.length===0){ showStatus('⚠ Ajoute au moins une référence'); return; }

  const id = editingId || uid();
  const entry = {
    id, date,
    mat: document.getElementById('f-mat').value,
    shift: document.getElementById('f-shift').value,
    process: document.getElementById('f-process').value,
    references: cleanRefs,
    comments,
    savedAt: new Date().toISOString()
  };

  const existingIdx = localEntries.findIndex(e=> e.id===id);
  if(existingIdx>=0) localEntries[existingIdx] = entry; else localEntries.push(entry);
  editingId = id;
  renderLog();

  try{
    await window.storage.set('entries:'+id, JSON.stringify(entry), true);
    const idx = await getIndex();
    if(!idx.includes(id)){ idx.push(id); await setIndex(idx); }
    showStatus(window.__localOnly ? '✓ Fiche enregistrée sur cet appareil' : '✓ Fiche enregistrée et partagée avec l\u2019équipe');
  }catch(err){
    showStatus('✓ Fiche enregistrée sur cet appareil (partage équipe indisponible)');
  }
}

async function loadLog(){
  try{
    const idx = await getIndex();
    for(const id of idx){
      if(localEntries.some(e=> e.id===id)) continue;
      try{
        const r = await window.storage.get('entries:'+id, true);
        if(r && r.value) localEntries.push(JSON.parse(r.value));
      }catch(err){}
    }
  }catch(err){}
  renderLog();
}

function renderLog(){
  const tbody = document.getElementById('log-body');
  const emptyEl = document.getElementById('log-empty');
  tbody.innerHTML = '';
  if(localEntries.length===0){ emptyEl.style.display='block'; return; }
  emptyEl.style.display='none';
  const entries = [...localEntries].sort((a,b)=> (b.date+b.shift).localeCompare(a.date+a.shift));
  entries.forEach(entry=>{
    const grandTotal = entry.references.reduce((s,r)=> s + r.hours.reduce((ss,v)=> ss+(parseFloat(v)||0),0), 0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${entry.date}</td>
      <td>${entry.shift}</td>
      <td>${entry.mat||'—'}</td>
      <td>${entry.process||'—'}</td>
      <td>${entry.references.map(r=>`<span class="pill">${r.ref}</span>`).join('')}</td>
      <td><b>${grandTotal}</b></td>
      <td class="row-actions">
        <button class="edit" data-id="${entry.id}">Éditer</button>
        <button class="xls" data-id="${entry.id}">Excel</button>
        <button class="del" data-id="${entry.id}">Suppr</button>
      </td>
    `;
    tbody.appendChild(tr);
    tr.querySelector('.edit').addEventListener('click', ()=> loadIntoForm(entry));
    tr.querySelector('.xls').addEventListener('click', ()=> exportEntry(entry));
    tr.querySelector('.del').addEventListener('click', ()=> deleteEntry(entry.id));
  });
}

function loadIntoForm(entry){
  document.getElementById('f-date').value = entry.date;
  document.getElementById('f-mat').value = entry.mat||'';
  document.getElementById('f-shift').value = entry.shift||'Matin';
  document.getElementById('f-process').value = entry.process||'';
  refs = entry.references.map(r=>({ref:r.ref, hours:[...r.hours]}));
  if(refs.length===0) refs=[newRef()];
  comments = {...defaultComments(), ...entry.comments};
  editingId = entry.id;
  renderRefs();
  renderComments();
  window.scrollTo({top:0, behavior:'smooth'});
  showStatus('Fiche chargée pour modification');
}

async function deleteEntry(id){
  if(!confirm("Supprimer cette fiche pour toute l'équipe ?")) return;
  localEntries = localEntries.filter(e=> e.id!==id);
  renderLog();
  try{
    await window.storage.delete('entries:'+id, true);
    const idx = await getIndex();
    await setIndex(idx.filter(x=> x!==id));
    showStatus('Fiche supprimée');
  }catch(err){
    showStatus('Supprimée sur cet appareil (sync équipe indisponible)');
  }
}

async function exportEntry(entry){
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Feuil1', { views:[{ rightToLeft:false, showGridLines:false }] });

    // Colonnes : A=References(label) B=Réf C..J=1h..8h K=TOTAL
    ws.columns = [
      { width: 5 },  // A
      { width: 15 }, // B
      { width: 9 },{ width: 9 },{ width: 9 },{ width: 9 }, // C-F (1h-4h)
      { width: 9 },{ width: 9 },{ width: 9 },{ width: 9 }, // G-J (5h-8h)
      { width: 11 }  // K TOTAL
    ];

    const thin = { style:'thin', color:{argb:'FF161d24'} };
    const allBorders = { top:thin, left:thin, bottom:thin, right:thin };
    const centered = { vertical:'middle', horizontal:'center', wrapText:true };

    function styleCell(cell, opts={}){
      cell.border = allBorders;
      cell.alignment = opts.alignment || centered;
      cell.font = Object.assign({ name:'Calibri', size:11 }, opts.font||{});
      if(opts.fill) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:opts.fill} };
    }

    // --- Ligne 1 : titre ---
    ws.mergeCells('A1:K1');
    const titleCell = ws.getCell('A1');
    titleCell.value = 'MOLDYN technical plastic maroc';
    styleCell(titleCell, { font:{ bold:false, size:16, color:{argb:'FFCC0000'} } });
    ws.getRow(1).height = 26;

    // --- Lignes 2-5 : entête fiche ---
    function headerRow(rowNum, label, value, boldLabel){
      ws.mergeCells(`A${rowNum}:B${rowNum}`);
      ws.mergeCells(`C${rowNum}:K${rowNum}`);
      const lc = ws.getCell(`A${rowNum}`);
      lc.value = label;
      styleCell(lc, { font:{ bold:true, size: boldLabel? 14:12 } });
      const vc = ws.getCell(`C${rowNum}`);
      vc.value = value;
      styleCell(vc, { font:{ size:12 } });
      ws.getRow(rowNum).height = 20;
    }
    headerRow(2, 'Date', entry.date, false);
    headerRow(3, 'Mat', entry.mat||'', true);
    headerRow(4, 'Shift', entry.shift||'', false);
    headerRow(5, 'PROCESS', entry.process||'', false);

    // --- Ligne 6 : entête colonnes horaires ---
    ws.mergeCells('A6:B6');
    styleCell(ws.getCell('A6'), { font:{ bold:true, size:10 } });
    const hourCols = ['C','D','E','F','G','H','I','J'];
    hourCols.forEach((col,i)=>{
      const c = ws.getCell(`${col}6`);
      c.value = (i+1)+'h';
      styleCell(c, { font:{ bold:true, size:10 } });
    });
    const totalHead = ws.getCell('K6');
    totalHead.value = 'TOTAL';
    styleCell(totalHead, { font:{ bold:true, size:10 } });
    ws.getRow(6).height = 16;

    // --- Lignes références ---
    const refStart = 7;
    const MIN_REF_ROWS = 6; // garde toujours assez de hauteur pour le texte vertical "References"
    const refCount = Math.max(entry.references.length, MIN_REF_ROWS);
    entry.references.forEach((r, i)=>{
      const row = refStart + i;
      const total = r.hours.reduce((s,v)=> s+(parseFloat(v)||0), 0);
      const refCell = ws.getCell(`B${row}`);
      refCell.value = r.ref;
      styleCell(refCell, { font:{ size:11 } });
      hourCols.forEach((col,h)=>{
        const c = ws.getCell(`${col}${row}`);
        const v = r.hours[h];
        c.value = v===''? null : Number(v);
        styleCell(c, { font:{ size:11 } });
      });
      const totalCell = ws.getCell(`K${row}`);
      totalCell.value = total;
      styleCell(totalCell, { font:{ bold:true, size:13 } });
      ws.getRow(row).height = 32;
    });
    // Lignes vides restantes (au moins jusqu'à MIN_REF_ROWS) avec bordures, pour garder le tableau complet
    for(let i=entry.references.length; i<refCount; i++){
      const row = refStart + i;
      const cellsInRow = ['B', ...hourCols, 'K'];
      cellsInRow.forEach(col=>{
        const c = ws.getCell(`${col}${row}`);
        styleCell(c, { font:{ size:11 } });
      });
      ws.getRow(row).height = 32;
    }
    // Colonne "References" fusionnée verticale sur toutes les lignes de réfs
    ws.mergeCells(`A${refStart}:A${refStart+refCount-1}`);
    const refLabelCell = ws.getCell(`A${refStart}`);
    refLabelCell.value = 'References'.split('').join('\n');
    styleCell(refLabelCell, { font:{ bold:true, size:10 }, alignment:{ vertical:'middle', horizontal:'center', wrapText:true } });

    // --- Section légende (bas-gauche) + Commentaires (bas-droite) ---
    const sectionStart = refStart + refCount + 1;

    // Légende des codes (numéro + libellé), colonnes A(num) / B-D(texte)
    CODES.forEach((code, i)=>{
      const row = sectionStart + i;
      ws.mergeCells(`B${row}:D${row}`);
      const numCell = ws.getCell(`A${row}`);
      numCell.value = i+1;
      styleCell(numCell, { font:{ size:11 } });
      const txtCell = ws.getCell(`B${row}`);
      txtCell.value = code;
      styleCell(txtCell, { font:{ size:11 }, alignment:{ vertical:'middle', horizontal:'center' } });
      ws.getRow(row).height = 20;
    });

    // Titre COMMENTAIRE
    ws.mergeCells(`F${sectionStart}:K${sectionStart}`);
    const commTitle = ws.getCell(`F${sectionStart}`);
    commTitle.value = 'COMMENTAIRE';
    commTitle.font = { bold:true, size:15, name:'Calibri' };
    commTitle.alignment = { vertical:'middle', horizontal:'center' };

    // Lignes 1H..8H avec le texte du commentaire (sans bordure, comme sur le modèle)
    for(let h=1; h<=8; h++){
      const row = sectionStart + h;
      const c = entry.comments[h] || {};
      const text = c.code ? (c.code + (c.mins ? ' ' + c.mins + ' min' : '')) : '';
      const hCell = ws.getCell(`F${row}`);
      hCell.value = h+'H';
      hCell.font = { bold:true, size:13, name:'Calibri' };
      hCell.alignment = { vertical:'middle', horizontal:'center' };
      ws.mergeCells(`G${row}:K${row}`);
      const txtCell = ws.getCell(`G${row}`);
      txtCell.value = text;
      txtCell.font = { size:11, name:'Calibri' };
      txtCell.alignment = { vertical:'middle', horizontal:'left' };
      ws.getRow(row).height = 20;
    }

    const filename = `Suivi_Production_${entry.date}_${entry.shift}.xlsx`;
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const banner = document.getElementById('dl-banner');
    const link = document.getElementById('dl-link');
    const text = document.getElementById('dl-text');
    text.textContent = filename;
    link.href = url;
    link.download = filename;
    banner.style.display = 'flex';
    banner.scrollIntoView({behavior:'smooth', block:'start'});
    showStatus('✓ Fichier prêt en haut de la page');
  }catch(err){
    console.error('Export failed', err);
    showStatus("✕ Échec de la génération du fichier.");
  }
}

document.getElementById('dl-close').addEventListener('click', ()=>{
  document.getElementById('dl-banner').style.display = 'none';
});
document.getElementById('add-ref').addEventListener('click', addRef);
document.getElementById('save-entry').addEventListener('click', saveEntry);
document.getElementById('reset-form').addEventListener('click', resetForm);

document.getElementById('dev-year').textContent = new Date().getFullYear();

function updateClock(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock-time').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  document.getElementById('clock-date').textContent =
    now.toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
updateClock();
setInterval(updateClock, 1000);

resetForm();
loadLog();

// Enregistrement du service worker (PWA installable + offline)
if('serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('./sw.js'); }catch(err){}
}
</script>
</body>
</html>
